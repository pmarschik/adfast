# Lint, test, coverage and govulncheck live in devkit's reusable workflow. The
# two jobs below stay here because they have no counterpart there: they exercise
# code paths specific to this repo.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push cancels the run it superseded, except on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    uses: pmarschik/devkit/.github/workflows/go-ci.yml@v1
    with:
      coverage-floor: 75

  # Fuzz targets never run under `go test ./...`, which executes the seed corpus
  # only. Thirty seconds each is a smoke test, not a campaign: it catches a
  # target that stopped compiling or started failing on its first mutation.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      - name: Fuzz smoke
        run: go test -run=^$ -fuzz=FuzzRoundTripIdempotent -fuzztime=30s .

      - name: Fuzz smoke (format contract)
        run: go test -run=^$ -fuzz=FuzzFormatSemanticsPreserved -fuzztime=30s .

  # The js/wasm build and its Node smoke test. This job is the ONLY thing
  # that exercises wasm/main.go: a `js && wasm`-tagged file never compiles
  # during `go test ./...` on the host, so the js.FuncOf glue would
  # otherwise ship untested.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise installs the Go version .config/mise/config.toml pins, which is the
      # toolchain wasm/wasm_exec.js was vendored from — that file is coupled to
      # the runtime that built the binary. One pin, checked by the drift step
      # below. Keep wasm/README.md's version table in step with it.
      - uses: jdx/mise-action@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Vendored wasm_exec.js matches the toolchain
        run: |
          if ! diff -u "$(go env GOROOT)/lib/wasm/wasm_exec.js" wasm/wasm_exec.js; then
            echo "::error::wasm/wasm_exec.js is out of step with this Go toolchain."
            echo "Re-vendor it and update the version table in wasm/README.md:"
            # Print the re-vendoring command literally.
            # shellcheck disable=SC2016
            echo '  cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" wasm/'
            exit 1
          fi

      - name: Build (GOOS=js GOARCH=wasm)
        working-directory: wasm
        run: |
          GOOS=js GOARCH=wasm go build -o adfast.wasm .
          ls -l adfast.wasm

      - name: Node smoke test
        working-directory: wasm
        run: node smoke.mjs
