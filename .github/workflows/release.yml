name: release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Root release tag to recover
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --config .config/goreleaser.yaml --release-notes CHANGELOG.md --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # All module tags point at one commit. Tell GoReleaser which root tag
          # triggered the workflow instead of relying on git's tag ordering.
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
