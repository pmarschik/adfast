[files]
# Fuzz corpus + fixtures contain arbitrary byte sequences; the emoji
# map is generated from emoji-toolkit shortnames verbatim.
extend-exclude = ["testdata/", "dialect/emoji_map.go"]

[default.extend-identifiers]
# goldmark's own API name (text.Reader) — not ours to fix.
PrecendingCharacter = "PrecendingCharacter"

[default.extend-words]
# Legitimate plural the checker flags against its singular suggestion.
canonicalizations = "canonicalizations"
# The ACE/punycode fragment of "example" inside golang.org/x/net/idna's own
# "xn--exmple-cua" output (urlliteral.go, urlliteral_test.go) — it is the
# library's measured answer, not a misspelling to fix.
exmple = "exmple"
