# Generated by `mise run sync-golangci`. Do not edit.
#
# Base:      devkit golangci/go.yml, at the ref .config/mise/config.toml pins.
# Overrides: .config/golangci.overrides.yml
#
# Edit the base in devkit or the overrides file here, then re-run the task.
# An edit to this file is lost on the next sync.
version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - nilerr
    - nilnesserr
    - sqlclosecheck
    - rowserrcheck
    - durationcheck
    - noctx
    - asasalint
    - makezero
    - musttag
    - exhaustive
    - exptostd
    - errorlint
    - errname
    - revive
    - gocritic
    - misspell
    - unconvert
    - unparam
    - usestdlibvars
    - predeclared
    - whitespace
    - modernize
    - intrange
    - perfsprint
    - tagalign
    - cyclop
    - gocognit
    - nestif
    - funlen
    - gosec
    - bidichk
    - depguard
    - gomoddirectives
    - thelper
    - usetesting
    - nolintlint
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        - printf # panics on unsafe pseudo-package in some analysis contexts; covered by staticcheck
    staticcheck:
      checks: ["all"]
    gocritic:
      enable-all: true
      disabled-checks:
        - hugeParam
    # Complexity budgets are higher than app code: this library is a
    # measured parser/renderer — functions mirror remark's rule tables.
    cyclop:
      max-complexity: 25
      package-average: 10.0
    gocognit:
      min-complexity: 80
    funlen:
      lines: 130
      statements: 80
    nestif:
      min-complexity: 6
    gosec:
      severity: medium
      confidence: medium
    exhaustive:
      default-signifies-exhaustive: true
    gomoddirectives:
      replace-local: true
    depguard:
      rules:
        main:
          deny:
            - pkg: "math/rand$"
              desc: "use math/rand/v2 instead"
            - pkg: "github.com/golang/protobuf"
              desc: "use google.golang.org/protobuf instead"
            - pkg: "io/ioutil"
              desc: "use io and os packages instead (deprecated since Go 1.16)"
            - pkg: "github.com/pkg/errors"
              desc: "use fmt.Errorf with %w or stdlib errors"
    misspell:
      locale: US
    revive:
      severity: warning
      confidence: 0.8
      enable-default-rules: true
      rules:
        - name: unexported-return
          disabled: true # builder pattern: concrete return types enable method chaining
        - name: early-return
          severity: warning
        - name: unnecessary-stmt
          severity: warning
        - name: confusing-naming
          severity: warning
        - name: confusing-results
          severity: warning
        - name: deep-exit
          severity: warning
        - name: import-shadowing
          severity: warning
        - name: modifies-value-receiver
          severity: warning
        - name: redefines-builtin-id
          severity: warning
        - name: waitgroup-by-value
          severity: error
        - name: unconditional-recursion
          severity: error
        - name: identical-branches
          severity: warning
        - name: defer
          severity: warning
          arguments:
            - ["call-chain", "loop"]
        - name: unused-receiver
          severity: warning
        - name: empty-block
          severity: warning
    tagalign:
      sort: true
      align: true
      order:
        - kong
        - name
        - short
        - env
        - config
        - default
        - optional
        - type
        - placeholder
        - enum
        - embed
        - negatable
        - help
        - json
        - yaml
        - toml
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets:
      - comments
      - std-error-handling
      - common-false-positives
    paths:
      - third_party
      - vendor
    rules:
      # The visitor dispatchers are one case per node kind by design —
      # the single maintained switch that gives visitors their
      # compile-time exhaustiveness. Branch count == kind count.
      - path: (ast|adf|dialect)/visitor\.go
        linters:
          - cyclop
          - gocyclo
          - funlen
      # The formatter normalization's dispatch switches mirror the AST
      # kind set the same way the visitors do (one branch per kind).
      - path: format_normalize\.go
        linters:
          - cyclop
          - gocyclo
          - funlen
      # gosec's G703 (path traversal via taint analysis) cannot see the
      # containment proof for the store's write paths: every write
      # target is produced by securePath (Base + Join + prefix check
      # against the assets/blob dir), index records are vetted by
      # validIndexEntry on load, and the copy fallbacks create with
      # O_EXCL via writeExclusive so a planted symlink is never
      # followed or overwritten. Covered by the path-traversal, symlink,
      # and index-sanitization tests in assets/security_test.go.
      - path: assets/assets\.go
        text: "G703"
        linters:
          - gosec
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
  exclusions:
    paths:
      - third_party
      - vendor
issues:
  max-issues-per-linter: 50
  max-same-issues: 5
