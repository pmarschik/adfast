# Conventional commit scopes for this project.
# Used by agents (via AGENTS.md reference) and optionally by cocogitto for enforcement.
#
# Component scopes:
# - core       root package — conversion pipeline, public API glue
# - parser     goldmark parser assembly (GFM tweaks, autolinks, strikethrough)
# - AST      the Markdown AST and goldmark→AST lifting
# - render     AST→markdown rendering (remark-compatible output)
# - adf        ADF types, codecs, the ADF model
# - assets     assets/ content-addressed media store + upload/sync
# - directives the directive dialect (media, panels, smart links, …)
# - convert    convert/ ADF↔AST conversion, both directions
# - format     the WithPrettierFormat style-preserving formatter mode
# - jira       jira/ addon module
# - confluence confluence/ addon module
# - skill      skill/ agent-skill module
# - wasm       wasm/ js/wasm build exposing adfast to JavaScript
# - docs       README, docs
# - deps       dependency bumps (the scope renovate writes)
# - build      local tooling, mise, scripts, developer setup
# - ci         GitHub Actions and CI automation
# - release    release flow, changelog, versioning
scopes = [
  "core",
  "parser",
  "AST",
  "render",
  "adf",
  "assets",
  "directives",
  "convert",
  "format",
  "jira",
  "confluence",
  "skill",
  "wasm",
  "docs",
  "deps",
  "build",
  "ci",
  "release",
]
